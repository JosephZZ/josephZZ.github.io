<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SuperTuxKart — reproduction (Northern Resort)</title>
<style>
  @font-face { font-family: 'Cantarell'; src: url('assets/fonts/Cantarell-Regular.otf'); }
  @font-face { font-family: 'SigmarOne'; src: url('assets/fonts/SigmarOne.otf'); }
  html, body { margin: 0; height: 100%; background: #0c0e14; color: #dfe3ef;
               font: 14px/1.5 Cantarell, system-ui, sans-serif; overflow: hidden; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; }
  #game { display: none; height: 100%; }
  #stage { position: relative; width: 100%; height: calc(100% - 62px); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  footer { height: 62px; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 2px; }
  .keys { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; color: #9aa3b8; }
  .keys b { color: #ffd479; }
  #stat { color: #9aa3b8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="status">loading…</div>
<div id="game">
  <div id="stage">
    <canvas id="scene"></canvas>
    <canvas id="hud"></canvas>
  </div>
  <footer>
    <div class="keys">
      <span><b>&uarr;</b> accelerate</span><span><b>&darr;</b> brake</span>
      <span><b>&larr; &rarr;</b> steer</span><span><b>N</b> nitro</span>
      <span><b>V</b> drift</span><span><b>Space</b> fire</span>
      <span><b>B</b> look back</span><span><b>Backspace</b> rescue</span>
      <span><b>Esc</b> pause</span><span><b>R</b> restart</span><span><b>M</b> minimap</span>
    </div>
    <div id="stat">…</div>
  </footer>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
